<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} | Stockerboard</title>
    <meta name="description" content="{{ meta_description }}">
    <link rel="canonical" href="{{ canonical_url }}">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="Stockerboard">
    <meta property="og:title" content="{{ page_title }} | Stockerboard">
    <meta property="og:description" content="{{ meta_description }}">
    <meta property="og:url" content="{{ canonical_url }}">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{{ page_title }} | Stockerboard">
    <meta name="twitter:description" content="{{ meta_description }}">
    
    <!-- Structured Data Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebPage",
      "name": "{{ page_title }}",
      "url": "{{ canonical_url }}",
      "description": "{{ meta_description }}",
      "publisher": {
        "@type": "Organization",
        "name": "Stockerboard",
        "url": "https://stockerboard.com/",
        "logo": "https://stockerboard.com/favicon.svg",
        "email": "community@stockerboard.com"
      }
    }
    </script>

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Anti-flicker Theme Initializer -->
    <script>
        (function() {
            try {
                const savedTheme = localStorage.getItem('stockerboard_theme');
                const theme = savedTheme ? savedTheme : 'light';
                document.documentElement.setAttribute('data-theme', theme);
            } catch(e) {}
        })();
    </script>

    <!-- Google Analytics 4 (GA4) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-STOCKERBOARD"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-STOCKERBOARD', { send_page_view: true });
    </script>

    <style>
        :root {
            --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --brand-green: #15803D;
            --brand-green-hover: #166534;
            --brand-green-light: #16A34A;
            --accent-emerald: #16A34A;
            --accent-coral: #F43F5E;
            --transition-smooth: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        [data-theme="dark"] {
            --bg-primary: #080C14;
            --bg-surface: #0E1420;
            --bg-surface-elevated: #151D2C;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-card: rgba(255, 255, 255, 0.06);
            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
            --text-muted: #64748B;
            --card-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
            --theme-toggle-bg: #151D2C;
            --theme-toggle-border: rgba(255, 255, 255, 0.14);
        }

        [data-theme="light"] {
            --bg-primary: #FCFDFD;
            --bg-surface: #FFFFFF;
            --bg-surface-elevated: #F8FAFC;
            --border-subtle: #E2E8F0;
            --border-card: #E5E7EB;
            --text-primary: #0F172A;
            --text-secondary: #475569;
            --text-muted: #94A3B8;
            --card-shadow: 0 1px 3px rgba(15, 23, 42, 0.03), 0 10px 25px -5px rgba(15, 23, 42, 0.05);
            --theme-toggle-bg: #FFFFFF;
            --theme-toggle-border: #CBD5E1;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--bg-primary);
            background-image: 
                radial-gradient(circle at 12% 18%, rgba(22, 163, 74, 0.05) 0%, transparent 45%),
                radial-gradient(circle at 88% 82%, rgba(244, 63, 94, 0.03) 0%, transparent 45%);
            background-attachment: fixed;
            color: var(--text-primary);
            font-family: var(--font-sans);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .page-wrapper {
            max-width: 1240px;
            margin: 0 auto;
            padding: 28px 24px 60px 24px;
        }

        /* Header Navigation */
        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-subtle);
            gap: 16px;
            flex-wrap: wrap;
        }

        .brand-unit {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-primary);
        }

        .brand-emblem {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: linear-gradient(135deg, #15803D, #16A34A);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-name {
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: -0.01em;
            color: var(--text-primary);
        }

        .header-nav-links {
            display: inline-flex;
            align-items: center;
            gap: 24px;
            margin-left: 32px;
            margin-right: auto;
        }

        .header-nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.92rem;
            font-weight: 500;
            transition: color 0.15s ease;
        }

        .header-nav-links a:hover,
        .header-nav-links a.active {
            color: var(--brand-green);
        }

        .nav-right-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .theme-toggle-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: var(--theme-toggle-bg);
            color: var(--text-primary);
            border: 1px solid var(--theme-toggle-border);
            border-radius: 9999px;
            padding: 6px 14px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-smooth);
            user-select: none;
        }

        .theme-toggle-btn:hover {
            border-color: var(--brand-green);
            transform: translateY(-1px);
        }

        .btn-home-return {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-surface-elevated);
            color: var(--text-primary);
            border: 1px solid var(--border-subtle);
            border-radius: 9999px;
            padding: 6px 14px;
            font-size: 0.82rem;
            font-weight: 600;
            text-decoration: none;
            transition: var(--transition-smooth);
        }

        .btn-home-return:hover {
            border-color: var(--brand-green);
            color: var(--brand-green);
        }

        /* Breadcrumb Navigation */
        .breadcrumb-nav {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .breadcrumb-nav a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.15s ease;
        }

        .breadcrumb-nav a:hover {
            color: var(--brand-green);
        }

        .breadcrumb-sep {
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        /* Informational Reading Container */
        .content-container {
            max-width: 860px;
            margin: 0 auto;
        }

        .page-header {
            margin-bottom: 36px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .page-eyebrow {
            display: inline-block;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--brand-green);
            margin-bottom: 8px;
        }

        .page-title {
            font-size: 2.1rem;
            font-weight: 800;
            line-height: 1.25;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            margin-bottom: 12px;
        }

        .page-summary {
            font-size: 1.05rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 16px;
        }

        .page-meta-row {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Typography & Content Formatting */
        .prose {
            color: var(--text-primary);
            font-size: 0.98rem;
            line-height: 1.7;
        }

        .prose h2 {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--text-primary);
            margin: 36px 0 14px 0;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .prose h3 {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-primary);
            margin: 24px 0 10px 0;
        }

        .prose p {
            margin-bottom: 18px;
            color: var(--text-secondary);
        }

        .prose ul, .prose ol {
            margin: 0 0 20px 24px;
            color: var(--text-secondary);
        }

        .prose li {
            margin-bottom: 8px;
        }

        .prose strong {
            color: var(--text-primary);
        }

        .prose code {
            font-family: var(--font-mono);
            font-size: 0.88em;
            background: var(--bg-surface-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: 4px;
            padding: 2px 6px;
            color: var(--text-primary);
        }

        /* Metric & Detail Cards */
        .metric-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 22px 24px;
            margin-bottom: 22px;
            box-shadow: var(--card-shadow);
        }

        .metric-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .metric-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .metric-badge {
            font-size: 0.72rem;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 9999px;
            background: rgba(22, 163, 74, 0.1);
            color: var(--brand-green);
            border: 1px solid rgba(22, 163, 74, 0.2);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .metric-formula {
            background: var(--bg-surface-elevated);
            border-left: 3px solid var(--brand-green);
            border-radius: 0 6px 6px 0;
            padding: 10px 14px;
            font-family: var(--font-mono);
            font-size: 0.86rem;
            color: var(--text-primary);
            margin: 12px 0;
            overflow-x: auto;
        }

        /* Info Alert Callouts */
        .info-callout {
            background: rgba(59, 130, 246, 0.05);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 10px;
            padding: 16px 20px;
            margin: 22px 0;
            font-size: 0.92rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .info-callout strong {
            color: var(--text-primary);
        }

        /* Tables */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            margin: 24px 0;
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88rem;
            text-align: left;
        }

        .data-table th {
            background: var(--bg-surface-elevated);
            padding: 12px 16px;
            font-weight: 700;
            color: var(--text-primary);
            border-bottom: 1px solid var(--border-subtle);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .data-table td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-subtle);
            color: var(--text-secondary);
        }

        .data-table tr:last-child td {
            border-bottom: none;
        }

        @media (max-width: 768px) {
            .page-title {
                font-size: 1.7rem;
            }
            .header-nav-links {
                display: none;
            }
            .metric-card {
                padding: 16px 18px;
            }
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <!-- Header -->
        <header>
            <nav class="top-nav" aria-label="Global Navigation">
                <a href="/" class="brand-unit" title="Return to Stockerboard Home">
                    <div class="brand-emblem">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <path d="M3 17L9 11L13 15L21 7" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M15 7H21V13" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <span class="brand-name">STOCKERBOARD</span>
                </a>

                <div class="header-nav-links">
                    <a href="/">Home</a>
                    <a href="/stocks/">Stocks</a>
                    <a href="/learn/">Learn</a>
                    <a href="/?mode=pro">Pro research</a>
                </div>

                <div class="nav-right-controls">
                    <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Toggle Light/Dark Theme">
                        <span id="themeToggleIcon">🌙</span>
                        <span id="themeToggleText">Theme</span>
                    </button>
                    <a href="/" class="btn-home-return">← Back to Screener</a>
                </div>
            </nav>
        </header>

        <!-- Main Reading Container -->
        <main class="content-container">
            <!-- Breadcrumbs -->
            <nav class="breadcrumb-nav" aria-label="Breadcrumb">
                <a href="/">Home</a>
                <span class="breadcrumb-sep">/</span>
                <span>{{ breadcrumb_section }}</span>
                <span class="breadcrumb-sep">/</span>
                <span aria-current="page">{{ page_title }}</span>
            </nav>

            <!-- Page Header -->
            <header class="page-header">
                <span class="page-eyebrow">{{ eyebrow }}</span>
                <h1 class="page-title">{{ h1_title }}</h1>
                <p class="page-summary">{{ summary }}</p>
                <div class="page-meta-row">
                    <span>Effective: October 2026</span>
                    <span>•</span>
                    <span>Stockerboard Trust &amp; Transparency Architecture</span>
                </div>
            </header>

            <!-- Prose Content -->
            <article class="prose">
                {{ content_body }}
            </article>
        </main>

        <!-- Global Reusable Footer Partial Injection -->
        {{ footer_html }}
    </div>

    <!-- Theme Toggle Script -->
    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme') || 'light';
            const next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            try {
                localStorage.setItem('stockerboard_theme', next);
            } catch(e) {}
            syncThemeIcon(next);
        }

        function syncThemeIcon(theme) {
            const icon = document.getElementById('themeToggleIcon');
            const text = document.getElementById('themeToggleText');
            if (icon && text) {
                if (theme === 'dark') {
                    icon.textContent = '☀️';
                    text.textContent = 'Light';
                } else {
                    icon.textContent = '🌙';
                    text.textContent = 'Dark';
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const current = document.documentElement.getAttribute('data-theme') || 'light';
            syncThemeIcon(current);
        });
    </script>
</body>
</html>
